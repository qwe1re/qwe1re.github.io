<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 Лучшие скидки в Steam</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #1b2838; color: #c7d5e0; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #66c0f4; }
        .controls { text-align: center; margin-bottom: 20px; }
        select, button { padding: 8px 12px; border-radius: 4px; border: none; background: #2a475e; color: white; cursor: pointer; }
        button:hover { background: #66c0f4; color: #1b2838; }
        #games-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .game-card { background: #2a475e; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s; }
        .game-card:hover { transform: translateY(-3px); }
        .game-card img { width: 100%; height: 130px; object-fit: cover; }
        .game-info { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .game-title { font-weight: bold; font-size: 14px; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .discount-badge { background: #4c6b22; color: #beee11; padding: 4px 8px; border-radius: 4px; font-weight: bold; display: inline-block; margin-bottom: 5px; }
        .price-row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .old-price { text-decoration: line-through; color: #738895; font-size: 12px; }
        .new-price { color: #beee11; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🔥 Игры с наибольшей скидкой</h1>
    <div class="controls">
        <label>Регион: </label>
        <select id="region-select">
            <option value="ru">Россия (RUB)</option>
            <option value="us">США (USD)</option>
            <option value="de">Германия (EUR)</option>
        </select>
        <button onclick="loadDeals()">Обновить</button>
    </div>
    <div id="games-container">Загрузка...</div>

    <script src="script.js"></script>
</body>
</html>
