<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qwe1re | Links</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
            --accent-color: #ff5500; /* Цвет SoundCloud */
            --tg-color: #229ED9;    /* Цвет Telegram */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            padding: 20px;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--tg-color), var(--accent-color));
            margin-bottom: 15px;
            display: inline-block;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        p {
            opacity: 0.7;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: transform 0.2s, background-color 0.2s;
            border: 1px solid transparent;
        }

        .link-card:hover {
            transform: translateY(-3px);
            background-color: #252525;
            border-color: #444;
        }

        .tg-link { border-left: 5px solid var(--tg-color); }
        .sc-link { border-left: 5px solid var(--accent-color); }

        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://i.pinimg.com/736x/e6/aa/15/e6aa15f88d1e00af75a1964b9ab2b8c7.jpg" class="profile-img">
        <h1>@qwe1re</h1>
        <p>Connect with me</p>

        <div class="links">
            <a href="https://t.me/NETYKOTA" class="link-card tg-link" target="_blank">
                Telegram (Основной)
            </a>
            
            <a href="https://t.me/Dontwritemeanymorepls" class="link-card tg-link" target="_blank">
                Telegram (Запасной)
            </a>

            <a href="https://soundcloud.com/qweire" class="link-card sc-link" target="_blank">
                SoundCloud
            </a>
        </div>

        <div class="footer">
            © 2026 qwe1re
        </div>
    </div>

</body>
</html>
