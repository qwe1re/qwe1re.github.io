<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>РЕГАТЬ ИЛИ НЕТ? | КАЗАХИ ИЛИ ТАДЖИКИ?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: #000;
    background-image: repeating-linear-gradient(90deg, #111 0px, #111 2px, #0a0a0a 2px, #0a0a0a 4px);
    color: #fff;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  .main-frame {
    width: 100%;
    max-width: 1300px;
    background-color: #050505;
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    border-radius: 30px;
    border: 2px solid #888;
    box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 50px rgba(0,0,0,0.9);
    padding: 50px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 750px;
  }

  /* Главный заголовок */
  .hero-title {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(60px, 11vw, 150px);
    line-height: 0.8;
    color: #b46aff;
    text-transform: uppercase;
    letter-spacing: -2px;
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    z-index: 1;
    pointer-events: none;
    text-shadow: 0 10px 30px rgba(0,0,0,0.8);
    text-align: center;
  }

  /* Центральный блок */
  .content-area {
    position: relative;
    display: flex;
    justify-content: center; /* Центрируем контент, так как цитаты убрали */
    align-items: center;
    margin-top: 180px;
    margin-bottom: 20px;
    z-index: 2;
    flex-grow: 1;
  }

  /* Увеличенная и опущенная гифка */
  .center-gif {
    position: absolute;
    left: 50%;
    top: 60%; /* Опустили чуть ниже */
    transform: translate(-50%, -50%);
    max-width: 450px; /* Увеличили размер */
    max-height: 450px;
    width: auto;
    height: auto;
    border-radius: 25px;
    box-shadow: 0 0 50px rgba(180, 106, 255, 0.5);
    border: 3px solid rgba(180, 106, 255, 0.7);
    z-index: 1;
  }

  /* Нижний текст */
  .bottom-text {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-family: 'Oswald', sans-serif;
    font-size: clamp(30px, 5vw, 70px); /* Уменьшили размер шрифта, чтобы влезло */
    font-weight: 700;
    line-height: 0.9;
    text-transform: uppercase;
    position: relative;
    z-index: 3;
    margin-bottom: 30px;
  }

  .text-left { 
    color: #fff; 
    display: flex; 
    align-items: center; 
    gap: 20px;
    max-width: 60%; /* Чтобы не наезжало на FACEIT */
  }
  
  .text-right { 
    color: #fff; 
    text-align: right; 
    white-space: nowrap;
  }

  /* Кнопка */
  .action-btn-wrapper {
    display: flex;
    justify-content: center;
    width: 100%;
    z-index: 3;
    margin-bottom: 20px;
  }

  .action-btn {
    background: #b46aff;
    color: #000;
    font-family: 'Oswald', sans-serif;
    font-size: 24px;
    font-weight: bold;
    text-transform: uppercase;
    padding: 18px 60px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(180, 106, 255, 0.4);
    transition: all 0.3s;
  }
  .action-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 40px rgba(180, 106, 255, 0.8);
  }

  /* Подпись автора */
  .made-by {
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 2px;
    z-index: 3;
  }

  /* Ползунок громкости */
  .volume-container {
    position: absolute;
    bottom: 20px;
    right: 30px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 10;
    background: rgba(0, 0, 0, 0.6);
    padding: 8px 15px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .volume-container svg {
    width: 20px;
    height: 20px;
    fill: #b46aff;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100px;
    background: transparent;
  }
  
  input[type=range]:focus {
    outline: none;
  }
  
  input[type=range]::-webkit-slider-runnable-track {
    width: 100%;
    height: 4px;
    cursor: pointer;
    background: #444;
    border-radius: 2px;
  }
  
  input[type=range]::-webkit-slider-thumb {
    height: 14px;
    width: 14px;
    border-radius: 50%;
    background: #b46aff;
    cursor: pointer;
    -webkit-appearance: none;
    margin-top: -5px;
    box-shadow: 0 0 10px rgba(180, 106, 255, 0.8);
  }

  /* Оверлей результата */
  .result-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
    padding: 40px;
  }
  .result-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  
  .result-image {
    max-width: 340px;
    max-height: 340px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    border: 2px solid rgba(255,255,255,0.1);
    display: none;
    object-fit: contain;
  }

  .result-title {
    font-family: 'Oswald', sans-serif;
    font-size: 80px;
    color: #b46aff;
    margin-bottom: 15px;
    text-transform: uppercase;
    text-align: center;
    line-height: 1;
  }
  .result-sub {
    font-size: 20px;
    color: #ccc;
    text-align: center;
    max-width: 800px;
    font-style: italic;
    line-height: 1.4;
  }
  .result-sub.no { color: #ff4444; }

  @media (max-width: 768px) {
    .main-frame { padding: 30px 20px; min-height: auto; }
    .hero-title { position: relative; top: 0; font-size: 50px; white-space: normal; margin-bottom: 20px; }
    .content-area { margin-top: 20px; }
    .center-gif { position: relative; top: 0; left: 0; transform: none; margin: 20px auto; display: block; width: 280px; height: 280px; }
    .bottom-text { font-size: 30px; flex-direction: column; align-items: center; gap: 10px; }
    .text-left { text-align: center; max-width: 100%; }
    .text-right { text-align: center; }
    .volume-container { bottom: 10px; right: 50%; transform: translateX(50%); }
  }
</style>
</head>
<body>

<div class="main-frame">
  
  <div class="hero-title">РЕГАТЬ ИЛИ НЕТ?</div>

  <div class="content-area">
    <!-- Гифка по центру -->
    <img src="https://media1.tenor.com/m/9MwgBZ30qnsAAAAd/crona-soul-eater.gif" class="center-gif" alt="Crona">
  </div>

  <div class="bottom-text">
    <div class="text-left">
      КАЗАХИ ИЛИ ТАДЖИКИ?
    </div>
    <div class="text-right">
      FACEIT
    </div>
  </div>

  <div class="action-btn-wrapper">
    <button id="rollBtn" class="action-btn">Крутить судьбу</button>
  </div>

  <div class="made-by">made by qwe1re</div>

  <!-- НЕВИДИМЫЙ АУДИОПЛЕЕР -->
  <audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <!-- ПАНЕЛЬ ГРОМКОСТИ -->
  <div class="volume-container">
    <svg viewBox="0 0 24 24">
      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.4">
  </div>

  <!-- ОВЕРЛЕЙ РЕЗУЛЬТАТА -->
  <div id="resultOverlay" class="result-overlay">
    <img id="resImg" class="result-image" src="" alt="Результат">
    <div id="resTitle" class="result-title"></div>
    <div id="resSub" class="result-sub"></div>
    <button id="closeBtn" class="action-btn" style="margin-top: 40px; background: transparent; border: 2px solid #b46aff; color: #b46aff; box-shadow: none; padding: 12px 40px; font-size: 18px;">Закрыть</button>
  </div>

</div>

<script>
(function() {
  var rollBtn = document.getElementById('rollBtn');
  var overlay = document.getElementById('resultOverlay');
  var closeBtn = document.getElementById('closeBtn');
  var bgMusic = document.getElementById('bgMusic');
  var volumeSlider = document.getElementById('volumeSlider');
  
  var resImg = document.getElementById('resImg');
  var resTitle = document.getElementById('resTitle');
  var resSub = document.getElementById('resSub');

  // КАРТИНКИ ДЛЯ РЕЗУЛЬТАТОВ
  var YES_IMAGE_URL = "https://i.pinimg.com/736x/b5/ef/ab/b5efab201bf5ecca2d52fb496c6b0a7d.jpg"; 
  var NO_IMAGE_URL  = "https://i.pinimg.com/736x/f3/d7/47/f3d747fe35ddb4d1353ece896f566d1f.jpg";  
  
  // СПИСОК ЦИТАТ (в результатах)
  var quotes = [
    "«Абсолютный!»", "«Запоминайте цитату…»", "«Муваюсь так жёстко!»",
    "«Вы зашли на стрим к абсолютному»", "«Ты что, глупый?!»",
    "«Куда ты смотришь, боже?!»", "«Да как он это делает?!»",
    "«Если тебе тяжело идти — значит, ты тащишь мешок картошки»",
    "«Неважно, кто перед тобой. Важно, сколько у тебя патронов»",
    "«Лучше быть абсолютным в чате, чем относительным по жизни»",
    "«Жду всех абсолютных в группе»", "«Да он с софтом играет!»",
    "«Вы вообще понимаете, кто перед вами находится?»", "«Я двигаюсь на уверенном»",
    "«Цитата Ская, запоминайте!»", "«Сука знает, что я в деле!»",
    "«Я включаю режим абсолютного»", "«Это был тактический мув, вы ничего не понимаете»",
    "«Чат, вы видите этот абсурд?»", "«Да как это не залетело, я же ровно в голову целился!»",
    "«Всё, я в тильте, не трогайте меня»", "«Мой микрофон не выдерживает этой гениальности»",
    "«Это не я слил, это пинг»", "«Вы думали я проиграл? Это был байт!»",
    "«Я читаю эту игру как открытую книгу»", "«Где мой хедшот, игра сломалась»",
    "«Это уровень абсолютного, вам не понять»", "«Я просто на голову выше всех в этом лобби»",
    "«Это чистый лак, ему просто повезло»", "«Я не проигрываю, я просто даю им шанс»",
    "«Мой прайм-тайм начался»", "«Это абсолютная доминация»",
    "«Вы недооцениваете мою силу»", "«Абсолютные всегда побеждают»"
  ];

  // Управление громкостью
  volumeSlider.addEventListener('input', function() {
    bgMusic.volume = this.value;
  });

  rollBtn.addEventListener('click', function() {
    if (bgMusic.paused) {
      bgMusic.volume = volumeSlider.value; 
      
      if (bgMusic.readyState >= 1) {
        setRandomStartTime();
      } else {
        bgMusic.addEventListener('loadedmetadata', setRandomStartTime, { once: true });
      }

      bgMusic.play().catch(function(error) {
        console.log("Музыка не найдена или заблокирована браузером.");
      });
    }

    rollBtn.disabled = true;
    rollBtn.textContent = "Решаем...";

    var ticks = 0;
    var maxTicks = 25;
    
    var spin = setInterval(function() {
      ticks++;
      if (ticks >= maxTicks) {
        clearInterval(spin);
        showFinalResult();
        rollBtn.disabled = false;
        rollBtn.textContent = "Крутить судьбу";
      }
    }, 80);
  });

  // Случайный старт (52 минуты)
  function setRandomStartTime() {
    var duration = bgMusic.duration;
    var maxTime = Math.min(3120, duration - 5); 
    
    if (maxTime > 0) {
      var randomTime = Math.random() * maxTime;
      bgMusic.currentTime = randomTime;
    }
  }

  function showFinalResult() {
    var isYes = Math.random() < 0.5;
    var imgUrl = isYes ? YES_IMAGE_URL : NO_IMAGE_URL;
    var randomQuote = quotes[Math.floor(Math.random() * quotes.length)];

    resImg.style.display = 'block';
    resImg.src = imgUrl;

    if (isYes) {
      resTitle.textContent = "РЕГАТЬ!";
      resTitle.style.color = "#b46aff";
      resSub.textContent = randomQuote + " — Skywhywalker";
      resSub.className = "result-sub";
    } else {
      resTitle.textContent = "НЕ РЕГАТЬ";
      resTitle.style.color = "#ff4444";
      resSub.textContent = randomQuote + " — Skywhywalker";
      resSub.className = "result-sub no";
    }

    overlay.classList.add('active');
  }

  closeBtn.addEventListener('click', function() {
    overlay.classList.remove('active');
  });
})();
</script>
</body>
</html>
