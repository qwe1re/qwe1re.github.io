<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>РЕГАТЬ ИЛИ НЕТ? | КС + FACEIT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: #000;
    background-image: repeating-linear-gradient(90deg, #111 0px, #111 2px, #0a0a0a 2px, #0a0a0a 4px);
    color: #fff;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  .main-frame {
    width: 100%;
    max-width: 1300px;
    background-color: #050505;
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    border-radius: 30px;
    border: 2px solid #888;
    box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 50px rgba(0,0,0,0.9);
    padding: 50px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 750px;
  }

  /* Главный заголовок */
  .hero-title {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(60px, 11vw, 150px);
    line-height: 0.8;
    color: #b46aff;
    text-transform: uppercase;
    letter-spacing: -2px;
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    z-index: 1;
    pointer-events: none;
    text-shadow: 0 10px 30px rgba(0,0,0,0.8);
    text-align: center;
  }

  /* Центральный блок */
  .content-area {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 160px;
    margin-bottom: 20px;
    z-index: 2;
    flex-grow: 1;
  }

  /* Гифка по центру */
  .center-gif {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 280px;
    height: 280px;
    border-radius: 20px;
    object-fit: cover;
    box-shadow: 0 0 40px rgba(180, 106, 255, 0.3);
    border: 2px solid rgba(180, 106, 255, 0.5);
    z-index: 1;
  }

  /* Цитаты по бокам */
  .text-col {
    width: 28%;
    font-size: 13px;
    line-height: 1.6;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    position: relative;
    padding-left: 15px;
    z-index: 2;
  }
  
  .text-col::before {
    content: '';
    position: absolute;
    left: 0;
    top: 2px;
    bottom: 2px;
    width: 3px;
    background-color: #b46aff;
  }

  .text-col.right { 
    text-align: right; 
    padding-left: 0;
    padding-right: 15px;
  }
  .text-col.right::before {
    left: auto;
    right: 0;
  }

  /* Нижний текст */
  .bottom-text {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-family: 'Oswald', sans-serif;
    font-size: clamp(40px, 8vw, 100px);
    font-weight: 700;
    line-height: 0.9;
    text-transform: uppercase;
    position: relative;
    z-index: 3;
    margin-bottom: 30px;
  }

  .text-left { color: #fff; display: flex; align-items: center; gap: 20px;}
  .text-left .plus { color: #b46aff; font-size: 1.2em; }
  .text-right { color: #fff; text-align: right; }

  /* Кнопка */
  .action-btn-wrapper {
    display: flex;
    justify-content: center;
    width: 100%;
    z-index: 3;
    margin-bottom: 20px;
  }

  .action-btn {
    background: #b46aff;
    color: #000;
    font-family: 'Oswald', sans-serif;
    font-size: 24px;
    font-weight: bold;
    text-transform: uppercase;
    padding: 18px 60px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(180, 106, 255, 0.4);
    transition: all 0.3s;
  }
  .action-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 40px rgba(180, 106, 255, 0.8);
  }

  /* Подпись автора */
  .made-by {
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 2px;
    z-index: 3;
  }

  /* Оверлей результата */
  .result-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
    padding: 40px;
  }
  .result-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  
  .result-image {
    max-width: 340px;
    max-height: 340px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    border: 2px solid rgba(255,255,255,0.1);
    display: none;
    object-fit: cover;
  }

  .result-title {
    font-family: 'Oswald', sans-serif;
    font-size: 80px;
    color: #b46aff;
    margin-bottom: 15px;
    text-transform: uppercase;
    text-align: center;
    line-height: 1;
  }
  .result-sub {
    font-size: 20px;
    color: #ccc;
    text-align: center;
    max-width: 800px;
    font-style: italic;
    line-height: 1.4;
  }
  .result-sub.no { color: #ff4444; }

  @media (max-width: 768px) {
    .main-frame { padding: 30px 20px; min-height: auto; }
    .hero-title { position: relative; top: 0; font-size: 60px; white-space: normal; margin-bottom: 20px; }
    .content-area { margin-top: 20px; flex-direction: column; gap: 20px; }
    .text-col { width: 100%; text-align: center; padding: 0; }
    .text-col::before { display: none; }
    .center-gif { position: relative; top: 0; left: 0; transform: none; margin: 20px auto; display: block; width: 200px; height: 200px; }
    .bottom-text { font-size: 50px; }
  }
</style>
</head>
<body>

<div class="main-frame">
  
  <div class="hero-title">РЕГАТЬ ИЛИ НЕТ?</div>

  <div class="content-area">
    
    <div class="text-col">
      «Вы вообще понимаете,<br>
      кто перед вами<br>
      находится?»
    </div>

    <!-- Гифка по центру -->
    <img src="https://media1.tenor.com/m/9MwgBZ30qnsAAAAd/crona-soul-eater.gif" class="center-gif" alt="Crona">

    <div class="text-col right">
      «Это был тактический мув,<br>
      вы ничего<br>
      не понимаете»
    </div>
  </div>

  <div class="bottom-text">
    <div class="text-left">
      КС <span class="plus">+</span>
    </div>
    <div class="text-right">
      FACEIT
    </div>
  </div>

  <div class="action-btn-wrapper">
    <button id="rollBtn" class="action-btn">Крутить судьбу</button>
  </div>

  <!-- Подпись -->
  <div class="made-by">made by qwe1re</div>

  <div id="resultOverlay" class="result-overlay">
    <img id="resImg" class="result-image" src="" alt="Результат">
    <div id="resTitle" class="result-title"></div>
    <div id="resSub" class="result-sub"></div>
    <button id="closeBtn" class="action-btn" style="margin-top: 40px; background: transparent; border: 2px solid #b46aff; color: #b46aff; box-shadow: none; padding: 12px 40px; font-size: 18px;">Закрыть</button>
  </div>

</div>

<script>
(function() {
  var rollBtn = document.getElementById('rollBtn');
  var overlay = document.getElementById('resultOverlay');
  var closeBtn = document.getElementById('closeBtn');
  
  var resImg = document.getElementById('resImg');
  var resTitle = document.getElementById('resTitle');
  var resSub = document.getElementById('resSub');

  // Ссылки на картинки для ДА и НЕТ
  var YES_IMAGE_URL = "https://i.ibb.co/6P5KqK0/purple-girl.jpg"; 
  var NO_IMAGE_URL  = "https://i.ibb.co/0yJzVq3/anime-face.jpg";  
  
  var quotes = [
    "«Абсолютный!»", "«Запоминайте цитату…»", "«Муваюсь так жёстко!»",
    "«Вы зашли на стрим к абсолютному»", "«Ты что, глупый?!»",
    "«Куда ты смотришь, боже?!»", "«Да как он это делает?!»",
    "«Если тебе тяжело идти — значит, ты тащишь мешок картошки»",
    "«Неважно, кто перед тобой. Важно, сколько у тебя патронов»",
    "«Лучше быть абсолютным в чате, чем относительным по жизни»",
    "«Жду всех абсолютных в группе»", "«Да он с софтом играет!»",
    "«Вы вообще понимаете, кто перед вами находится?»", "«Я двигаюсь на уверенном»",
    "«Цитата Ская, запоминайте!»", "«Сука знает, что я в деле!»",
    "«Я включаю режим абсолютного»", "«Это был тактический мув, вы ничего не понимаете»",
    "«Чат, вы видите этот абсурд?»", "«Да как это не залетело, я же ровно в голову целился!»",
    "«Всё, я в тильте, не трогайте меня»", "«Мой микрофон не выдерживает этой гениальности»",
    "«Это не я слил, это пинг»", "«Вы думали я проиграл? Это был байт!»",
    "«Я читаю эту игру как открытую книгу»", "«Где мой хедшот, игра сломалась»",
    "«Это уровень абсолютного, вам не понять»", "«Я просто на голову выше всех в этом лобби»",
    "«Это чистый лак, ему просто повезло»", "«Я не проигрываю, я просто даю им шанс»",
    "«Мой прайм-тайм начался»", "«Это абсолютная доминация»",
    "«Вы недооцениваете мою силу»", "«Абсолютные всегда побеждают»"
  ];

  rollBtn.addEventListener('click', function() {
    rollBtn.disabled = true;
    rollBtn.textContent = "Решаем...";

    var ticks = 0;
    var maxTicks = 25; // Увеличили количество тиков, чтобы анимация длилась дольше
    
    var spin = setInterval(function() {
      ticks++;
      if (ticks >= maxTicks) {
        clearInterval(spin);
        showFinalResult();
        rollBtn.disabled = false;
        rollBtn.textContent = "Крутить судьбу";
      }
    }, 80); // Интервал между тиками (80 мс)
  });

  function showFinalResult() {
    // Шансы 50 на 50
    var isYes = Math.random() < 0.5;
    var imgUrl = isYes ? YES_IMAGE_URL : NO_IMAGE_URL;
    var randomQuote = quotes[Math.floor(Math.random() * quotes.length)];

    resImg.style.display = 'block';
    resImg.src = imgUrl;

    if (isYes) {
      resTitle.textContent = "РЕГАТЬ!";
      resTitle.style.color = "#b46aff";
      resSub.textContent = randomQuote + " — Skywhywalker";
      resSub.className = "result-sub";
    } else {
      resTitle.textContent = "НЕ РЕГАТЬ";
      resTitle.style.color = "#ff4444";
      resSub.textContent = randomQuote + " — Skywhywalker";
      resSub.className = "result-sub no";
    }

    overlay.classList.add('active');
  }

  closeBtn.addEventListener('click', function() {
    overlay.classList.remove('active');
  });
})();
</script>
</body>
</html>
