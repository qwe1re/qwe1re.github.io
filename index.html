<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>РЕГАТЬ ИЛИ НЕТ?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: #000;
    background-image: radial-gradient(circle at 50% 0%, #1a0b2e 0%, #000000 70%),
                      repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 4px);
    color: #fff;
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
    perspective: 1200px;
  }

  /* 3D-Стеклянная рамка */
  .main-frame {
    width: 100%;
    max-width: 1300px;
    background: rgba(15, 10, 25, 0.5);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border-radius: 40px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 
      0 30px 60px rgba(0, 0, 0, 0.6), 
      inset 0 1px 0 rgba(255, 255, 255, 0.2),
      inset 0 -1px 0 rgba(0, 0, 0, 0.5);
    /* Адаптивные отступы, чтобы текст не прилипал к краям */
    padding: clamp(20px, 5vw, 50px);
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: auto;
    gap: clamp(20px, 4vw, 40px);
    transform-style: preserve-3d;
    transition: transform 0.2s ease-out, box-shadow 0.5s ease; 
    will-change: transform;
    /* Убираем жесткую высоту, чтобы рамка сжималась по контенту */
  }

  /* Эффект светящихся уголков при прокрутке */
  .main-frame.glowing-corners {
    box-shadow: 
      0 30px 60px rgba(0, 0, 0, 0.6), 
      inset 0 0 40px rgba(180, 106, 255, 0.6),
      inset 0 0 80px rgba(180, 106, 255, 0.3),
      0 0 30px rgba(180, 106, 255, 0.5);
    border-color: rgba(180, 106, 255, 0.8);
    animation: pulseGlow 1.5s infinite alternate;
  }

  @keyframes pulseGlow {
    0% { box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 0 40px rgba(180, 106, 255, 0.6), 0 0 30px rgba(180, 106, 255, 0.5); }
    100% { box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 0 60px rgba(180, 106, 255, 0.9), 0 0 50px rgba(180, 106, 255, 0.8); }
  }

  .hero-title {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-weight: 900;
    /* Динамический размер шрифта с защитой от переполнения */
    font-size: clamp(30px, 11vw, 150px);
    line-height: 1;
    color: #b46aff;
    text-transform: uppercase;
    letter-spacing: -2px;
    word-break: break-word;
    text-align: center;
    z-index: 2;
    text-shadow: 0 10px 20px rgba(0,0,0,0.8), 0 20px 40px rgba(180, 106, 255, 0.3);
    transform: translateZ(50px);
    width: 100%;
    max-width: 100%;
  }

  .center-gif {
    width: 100%;
    max-width: min(450px, 80vw);
    height: auto;
    border-radius: 30px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 40px rgba(180, 106, 255, 0.4);
    border: 2px solid rgba(255, 255, 255, 0.2);
    z-index: 1;
    object-fit: contain;
    transform: translateZ(30px);
  }

  .action-btn {
    background: linear-gradient(135deg, #c37bff 0%, #9145ff 100%);
    color: #fff;
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-weight: bold;
    font-size: clamp(16px, 4vw, 24px);
    text-transform: uppercase;
    padding: clamp(12px, 3vw, 20px) clamp(30px, 8vw, 70px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 15px 30px rgba(0,0,0,0.5), 0 5px 15px rgba(180, 106, 255, 0.4), inset 0 2px 5px rgba(255,255,255,0.4);
    transition: all 0.2s;
    z-index: 3;
    transform: translateZ(60px);
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    max-width: 100%;
    white-space: nowrap;
  }
  .action-btn:hover { transform: translateZ(80px) scale(1.05); }
  .action-btn:active { transform: translateZ(30px) scale(0.95); }

  /* Steam иконка */
  .steam-link {
    position: absolute;
    bottom: 25px;
    left: 25px;
    z-index: 10;
    opacity: 0.6;
    transition: all 0.3s;
    display: flex;
    transform: translateZ(20px);
  }
  .steam-link:hover { opacity: 1; transform: translateZ(40px) scale(1.1); }
  .steam-link img { 
    width: 36px; 
    height: 36px; 
    object-fit: contain; 
    border-radius: 8px;
    filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));
  }

  /* Плеер */
  .audio-player {
    position: absolute;
    bottom: 25px;
    right: 30px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 15px;
    border-radius: 20px;
    z-index: 10;
    width: clamp(180px, 20vw, 260px); 
    box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
    transform: translateZ(20px);
  }

  .player-controls { display: flex; align-items: center; gap: 12px; }

  .play-btn {
    background: linear-gradient(135deg, #c37bff 0%, #9145ff 100%);
    border: 1px solid rgba(255,255,255,0.4);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .play-btn:hover { transform: scale(1.1); }
  .play-btn:active { transform: scale(0.9); }
  .play-btn svg { width: 14px; height: 14px; fill: #fff; }

  .seek-bar { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; }
  
  .volume-control { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .volume-control svg { width: 16px; height: 16px; fill: #c37bff; flex-shrink: 0; }

  input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; cursor: pointer; }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb {
    height: 14px; width: 14px; border-radius: 50%; background: #fff; -webkit-appearance: none; margin-top: -5px; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
  }

  /* Рулетка */
  .roulette-container {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 15; 
    perspective: 1500px;
    transform-style: preserve-3d;
  }
  .roulette-container.active { display: flex; }

  .roulette-window {
    width: 90%;
    max-width: 700px;
    height: clamp(150px, 25vw, 220px);
    background: linear-gradient(to bottom, #111, #050505);
    border: 2px solid rgba(180, 106, 255, 0.5); border-radius: 20px;
    position: relative; overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 50px rgba(180, 106, 255, 0.2);
    transform: rotateX(10deg);
    transition: transform 0.2s ease-out;
    will-change: transform;
  }
  .roulette-window::before, .roulette-window::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 100px; z-index: 5; pointer-events: none;
  }
  .roulette-window::before { left: 0; background: linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%); }
  .roulette-window::after { right: 0; background: linear-gradient(to left, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%); }

  .roulette-pointer {
    position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: #fff;
    transform: translateX(-50%); z-index: 10; box-shadow: 0 0 20px #fff, 0 0 40px #b46aff;
  }

  .roulette-track { display: flex; align-items: center; height: 100%; position: absolute; left: 0; will-change: transform; }

  .roulette-item {
    width: clamp(130px, 20vw, 220px); 
    flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-right: 1px solid rgba(255,255,255,0.05); height: 100%; gap: 10px;
    background: radial-gradient(circle at 50% 50%, rgba(180, 106, 255, 0.05) 0%, transparent 70%);
  }
  .roulette-item img {
    width: clamp(70px, 12vw, 110px); 
    height: clamp(70px, 12vw, 110px); 
    border-radius: 15px; object-fit: cover;
    box-shadow: 0 10px 20px rgba(0,0,0,0.8), 0 0 15px rgba(180, 106, 255, 0.3); transform: translateZ(20px);
  }
  
  .roulette-item .item-text {
    font-family: Georgia, 'Times New Roman', serif; 
    font-style: italic;
    font-weight: bold;
    font-size: clamp(14px, 2.5vw, 20px); 
    text-transform: uppercase;
    text-shadow: 0 2px 5px rgba(0,0,0,0.8); transform: translateZ(10px);
  }
  .roulette-item.yes .item-text { color: #c37bff; }
  .roulette-item.no .item-text { color: #ff4444; }

  /* Результат */
  .result-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(25px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.5s; padding: 40px;
  }
  .result-overlay.active { opacity: 1; pointer-events: auto; }

  .result-image {
    width: 100%;
    max-width: 320px; 
    max-height: 40vh; 
    border-radius: 25px; margin-bottom: 25px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(180, 106, 255, 0.3);
    border: 2px solid rgba(255,255,255,0.2); display: none; object-fit: contain; transform: translateZ(40px);
  }
  .result-title {
    font-family: Georgia, 'Times New Roman', serif; 
    font-style: italic;
    font-weight: 900;
    font-size: clamp(40px, 8vw, 80px); 
    color: #b46aff; 
    margin-bottom: 15px;
    text-transform: uppercase; 
    text-align: center; 
    line-height: 1; 
    text-shadow: 0 10px 20px rgba(0,0,0,0.8);
    transform: translateZ(50px);
    word-break: break-word;
  }
  .result-sub {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: clamp(14px, 3vw, 20px); 
    color: #ddd; 
    text-align: center; 
    max-width: 800px; 
    line-height: 1.4; 
    margin-bottom: 25px; 
    text-shadow: 0 2px 5px rgba(0,0,0,0.5); 
    transform: translateZ(30px);
    word-break: break-word;
  }
  .result-sub.no { color: #ff6b6b; }

  .result-buttons { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 10px; transform: translateZ(60px); width: 100%; }

  .faceit-btn {
    background: linear-gradient(135deg, #ffaa33 0%, #ff7b00 100%); color: #000;
    font-family: Georgia, 'Times New Roman', serif; 
    font-style: italic;
    font-weight: bold;
    font-size: clamp(14px, 3vw, 20px); 
    text-transform: uppercase;
    padding: 16px 50px; border: 1px solid rgba(255,255,255,0.4); border-radius: 50px; cursor: pointer;
    text-decoration: none; box-shadow: 0 10px 25px rgba(255, 140, 0, 0.4), inset 0 2px 5px rgba(255,255,255,0.5);
    transition: all 0.2s; display: none;
    text-align: center;
    width: 100%;
    max-width: 300px;
  }
  .faceit-btn:hover { transform: scale(1.05); }
  .faceit-btn:active { transform: scale(0.95); }

  .youtube-btn {
    background: linear-gradient(135deg, #ff4d4d 0%, #cc0000 100%); color: #fff;
    font-family: Georgia, 'Times New Roman', serif; 
    font-style: italic;
    font-weight: bold;
    font-size: clamp(14px, 3vw, 20px); 
    text-transform: uppercase;
    padding: 16px 50px; border: 1px solid rgba(255,255,255,0.4); border-radius: 50px; cursor: pointer;
    text-decoration: none; box-shadow: 0 10px 25px rgba(255, 0, 0, 0.4), inset 0 2px 5px rgba(255,255,255,0.3);
    transition: all 0.2s; display: none;
    text-align: center;
    width: 100%;
    max-width: 300px;
  }
  .youtube-btn:hover { transform: scale(1.05); }
  .youtube-btn:active { transform: scale(0.95); }

  .close-btn {
    background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3); color: #fff;
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-weight: bold;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3); padding: 14px 45px; font-size: 18px; border-radius: 50px;
    width: 100%;
    max-width: 300px;
  }
  .close-btn:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.05); }

  /* Адаптация под мобильные устройства */
  @media (max-width: 768px) {
    body { 
      padding: 10px; 
      align-items: flex-start; 
      padding-top: 20px;
    }
    
    .main-frame { 
      padding: 20px; 
      gap: 20px;
      margin-bottom: 140px; /* Место для плеера и стима */
      transform: none !important; /* Отключаем 3D на телефонах */
    }
    
    /* Плеер и Steam на мобилках переносим вниз в поток */
    .audio-player { 
      position: relative; 
      bottom: 0; 
      right: 0; 
      width: 100%; 
      max-width: 300px; 
      margin: 0 auto;
    }
    
    .steam-link { 
      bottom: 10px; 
      left: 50%; 
      transform: translateX(-50%); 
    }
    
    .result-overlay { padding: 20px; }
  }
</style>
</head>
<body>

<div class="main-frame" id="mainFrame">
  
  <!-- Ссылка на Steam -->
  <a href="https://steamcommunity.com/id/qweire/" target="_blank" class="steam-link" title="Мой Steam">
    <img src="https://riotpixels.net/wp/wp-content/uploads/2015/03/steam-generic-logo-v2-300px.jpg" alt="Steam">
  </a>

  <div class="hero-title">РЕГАТЬ ИЛИ НЕТ?</div>

  <img src="https://media1.tenor.com/m/9MwgBZ30qnsAAAAd/crona-soul-eater.gif" class="center-gif" alt="Crona">

  <button id="rollBtn" class="action-btn">Крутить судьбу</button>

  <div class="audio-player">
    <div class="player-controls">
      <button id="playBtn" class="play-btn">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="seek-bar">
        <input type="range" id="seekSlider" min="0" max="100" value="0" step="0.1">
      </div>
    </div>
    <div class="volume-control">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.4">
    </div>
  </div>

  <audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div id="rouletteContainer" class="roulette-container">
    <div class="roulette-window">
      <div class="roulette-pointer"></div>
      <div id="rouletteTrack" class="roulette-track"></div>
    </div>
  </div>

  <div id="resultOverlay" class="result-overlay">
    <img id="resImg" class="result-image" src="" alt="Результат">
    <div id="resTitle" class="result-title"></div>
    <div id="resSub" class="result-sub"></div>
    
    <div class="result-buttons">
      <a href="https://www.faceit.com/ru/matchmaking" target="_blank" id="faceitBtn" class="faceit-btn">Играть на FACEIT</a>
      <a href="https://www.youtube.com/" target="_blank" id="youtubeBtn" class="youtube-btn">Смотреть YouTube</a>
      <button id="closeBtn" class="action-btn close-btn">Закрыть</button>
    </div>
  </div>

</div>

<script>
(function() {
  var mainFrame = document.getElementById('mainFrame');
  var rollBtn = document.getElementById('rollBtn');
  var overlay = document.getElementById('resultOverlay');
  var closeBtn = document.getElementById('closeBtn');
  
  var resImg = document.getElementById('resImg');
  var resTitle = document.getElementById('resTitle');
  var resSub = document.getElementById('resSub');
  var faceitBtn = document.getElementById('faceitBtn');
  var youtubeBtn = document.getElementById('youtubeBtn');

  var rouletteContainer = document.getElementById('rouletteContainer');
  var rouletteTrack = document.getElementById('rouletteTrack');
  var rouletteWindow = document.querySelector('.roulette-window');

  var bgMusic = document.getElementById('bgMusic');
  var playBtn = document.getElementById('playBtn');
  var playIcon = document.getElementById('playIcon');
  var seekSlider = document.getElementById('seekSlider');
  var volumeSlider = document.getElementById('volumeSlider');

  var YES_IMAGE_URL = "https://i.pinimg.com/736x/b5/ef/ab/b5efab201bf5ecca2d52fb496c6b0a7d.jpg"; 
  var NO_IMAGE_URL  = "https://i.pinimg.com/736x/f3/d7/47/f3d747fe35ddb4d1353ece896f566d1f.jpg";  
  
  var quotes = [
    "«Абсолютный!»", "«Запоминайте цитату…»", "«Муваюсь так жёстко!»",
    "«Вы зашли на стрим к абсолютному»", "«Ты что, глупый?!»",
    "«Куда ты смотришь, боже?!»", "«Да как он это делает?!»",
    "«Если тебе тяжело идти — значит, ты тащишь мешок картошки»",
    "«Неважно, кто перед тобой. Важно, сколько у тебя патронов»",
    "«Лучше быть абсолютным в чате, чем относительным по жизни»",
    "«Жду всех абсолютных в группе»", "«Да он с софтом играет!»",
    "«Вы вообще понимаете, кто перед вами находится?»", "«Я двигаюсь на уверенном»",
    "«Цитата Ская, запоминайте!»", "«Сука знает, что я в деле!»",
    "«Я включаю режим абсолютного»", "«Это был тактический мув, вы ничего не понимаете»",
    "«Чат, вы видите этот абсурд?»", "«Да как это не залетело, я же ровно в голову целился!»",
    "«Всё, я в тильте, не трогайте меня»", "«Мой микрофон не выдерживает этой гениальности»",
    "«Это не я слил, это пинг»", "«Вы думали я проиграл? Это был байт!»",
    "«Я читаю эту игру как открытую книгу»", "«Где мой хедшот, игра сломалась»",
    "«Это уровень абсолютного, вам не понять»", "«Я просто на голову выше всех в этом лобби»",
    "«Это чистый лак, ему просто повезло»", "«Я не проигрываю, я просто даю им шанс»",
    "«Мой прайм-тайм начался»", "«Это абсолютная доминация»",
    "«Вы недооцениваете мою силу»", "«Абсолютные всегда побеждают»"
  ];

  // ================= 3D-ЭФФЕКТ =================
  document.addEventListener('mousemove', function(e) {
    if (window.innerWidth > 768) {
      var xAxis = (window.innerWidth / 2 - e.pageX) / 200; 
      var yAxis = (window.innerHeight / 2 - e.pageY) / 200; 
      
      mainFrame.style.transform = 'rotateY(' + xAxis + 'deg) rotateX(' + yAxis + 'deg)';

      if (rouletteContainer.classList.contains('active')) {
        rouletteWindow.style.transform = 'rotateX(10deg) rotateY(' + (xAxis * 0.5) + 'deg) rotateX(' + (yAxis * 0.5) + 'deg)';
      }
    }
  });

  document.addEventListener('mouseleave', function() {
    mainFrame.style.transform = 'rotateY(0deg) rotateX(0deg)';
    if (rouletteWindow) {
      rouletteWindow.style.transform = 'rotateX(10deg) rotateY(0deg) rotateX(0deg)';
    }
  });

  // ================= ЛОГИКА ПЛЕЕРА =================
  playBtn.addEventListener('click', function() {
    if (bgMusic.paused) {
      bgMusic.play();
      playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    } else {
      bgMusic.pause();
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    }
  });

  bgMusic.addEventListener('timeupdate', function() {
    if (!isNaN(bgMusic.duration)) {
      var percent = (bgMusic.currentTime / bgMusic.duration) * 100;
      seekSlider.value = percent;
    }
  });

  seekSlider.addEventListener('input', function() {
    if (!isNaN(bgMusic.duration)) {
      var seekTo = (this.value / 100) * bgMusic.duration;
      bgMusic.currentTime = seekTo;
    }
  });

  volumeSlider.addEventListener('input', function() {
    bgMusic.volume = this.value;
  });
  bgMusic.volume = volumeSlider.value;

  bgMusic.volume = 0.4;
  var playPromise = bgMusic.play();
  
  if (playPromise !== undefined) {
    playPromise.then(function() {
      playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    }).catch(function() {
      var enableAudio = function() {
        bgMusic.play();
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        document.removeEventListener('click', enableAudio);
        document.removeEventListener('touchstart', enableAudio);
      };
      document.addEventListener('click', enableAudio);
      document.addEventListener('touchstart', enableAudio);
    });
  }

  // ================= ЛОГИКА РУЛЕТКИ =================
  rollBtn.addEventListener('click', function() {
    rollBtn.disabled = true;
    rollBtn.style.opacity = '0.5';
    
    mainFrame.classList.add('glowing-corners');
    
    var isYes = Math.random() < 0.5;
    startRouletteAnimation(isYes);
  });

  function startRouletteAnimation(isYes) {
    rouletteTrack.innerHTML = '';
    rouletteTrack.style.transition = 'none';
    rouletteTrack.style.transform = 'translateX(0)';
    
    if (rouletteWindow) rouletteWindow.style.transform = 'rotateX(10deg) rotateY(0deg) rotateX(0deg)';

    var itemsCount = 50;
    var winningIndex = 45;

    for (var i = 0; i < itemsCount; i++) {
      var el = document.createElement('div');
      el.className = 'roulette-item';
      
      var currentIsYes = (i === winningIndex) ? isYes : (Math.random() < 0.5);
      el.classList.add(currentIsYes ? 'yes' : 'no');
      
      var img = document.createElement('img');
      img.src = currentIsYes ? YES_IMAGE_URL : NO_IMAGE_URL;
      el.appendChild(img);
      
      var text = document.createElement('div');
      text.className = 'item-text';
      text.textContent = currentIsYes ? 'РЕГАТЬ' : 'НЕ РЕГАТЬ';
      el.appendChild(text);

      rouletteTrack.appendChild(el);
    }

    rouletteContainer.classList.add('active');
    
    var itemWidth = window.innerWidth <= 768 ? 130 : 220; // Ширина элемента
    var randomOffset = (Math.random() - 0.5) * (itemWidth * 0.6);
    var windowWidth = document.querySelector('.roulette-window').offsetWidth;
    
    setTimeout(function() {
      var moveDistance = (winningIndex * itemWidth) - (windowWidth / 2) + (itemWidth / 2) + randomOffset;
      rouletteTrack.style.transition = 'transform 5s cubic-bezier(0.15, 0.85, 0.3, 1)';
      rouletteTrack.style.transform = 'translateX(-' + moveDistance + 'px)';
      
      setTimeout(function() {
        rouletteContainer.classList.remove('active');
        showFinalResult(isYes);
        rollBtn.disabled = false;
        rollBtn.style.opacity = '1';
        
        mainFrame.classList.remove('glowing-corners');
      }, 5200);
    }, 50);
  }

  function showFinalResult(isYes) {
    var imgUrl = isYes ? YES_IMAGE_URL : NO_IMAGE_URL;
    var randomQuote = quotes[Math.floor(Math.random() * quotes.length)];

    resImg.style.display = 'block';
    resImg.src = imgUrl;

    if (isYes) {
      resTitle.textContent = "РЕГАТЬ!";
      resTitle.style.color = "#b46aff";
      resSub.textContent = randomQuote + " — Skywhywalker";
      resSub.className = "result-sub";
      faceitBtn.style.display = 'block'; 
      youtubeBtn.style.display = 'none'; 
    } else {
      resTitle.textContent = "НЕ РЕГАТЬ";
      resTitle.style.color = "#ff4444";
      resSub.textContent = randomQuote + " — Skywhywalker";
      resSub.className = "result-sub no";
      faceitBtn.style.display = 'none'; 
      youtubeBtn.style.display = 'block'; 
    }

    overlay.classList.add('active');
  }

  closeBtn.addEventListener('click', function() {
    overlay.classList.remove('active');
  });
})();
</script>
</body>
</html>
