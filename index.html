<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qwe1re | SoundCloud</title>
    <style>
        /* Стиль "Черный Лофт" */
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a; /* Глубокий черный */
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                url('https://zefirka.club/uploads/posts/2022-11/thumbs/1668551752_16-zefirka-club-p-chernii-fon-dlya-oboev-bez-nichego-17.jpg'); /* Текстура бетона/лофта */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #e0e0e0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: rgba(20, 20, 20, 0.85); /* Полупрозрачная панель */
            padding: 40px;
            border-radius: 4px;
            border: 1px solid #333; /* Индустриальная рамка */
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: #fff;
            font-weight: 200;
        }

        .sub-text {
            font-size: 0.9rem;
            color: #888;
            letter-spacing: 3px;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        .sc-widget-container {
            border-top: 1px solid #333;
            padding-top: 30px;
        }

        .btn-profile {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background: transparent;
            color: #fff;
            text-decoration: none;
            border: 1px solid #fff;
            transition: all 0.3s ease;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .btn-profile:hover {
            background: #fff;
            color: #000;
        }

        /* Адаптив для мобилок */
        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
<div class="container">
        <h1>qwe1re</h1>
        <p class="sub-text">XDD</p>
    
        </div>

        <a href="https://soundcloud.com/qweire" target="_blank" class="btn-profile">Открыть профиль</a>
    </div>

</body>
</html>
