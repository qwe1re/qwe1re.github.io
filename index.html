<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>РЕГАТЬ ИЛИ НЕТ?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: #000;
    background-image: repeating-linear-gradient(90deg, #111 0px, #111 2px, #0a0a0a 2px, #0a0a0a 4px);
    color: #fff;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  .main-frame {
    width: 100%;
    max-width: 1300px;
    background-color: #050505;
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    border-radius: 30px;
    border: 2px solid #888;
    box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 50px rgba(0,0,0,0.9);
    padding: 50px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 750px;
    gap: 40px;
  }

  /* Главный заголовок */
  .hero-title {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(60px, 11vw, 150px);
    line-height: 0.8;
    color: #b46aff;
    text-transform: uppercase;
    letter-spacing: -2px;
    white-space: nowrap;
    z-index: 2;
    text-shadow: 0 10px 30px rgba(0,0,0,0.8);
    text-align: center;
  }

  /* Гифка по центру */
  .center-gif {
    max-width: 450px;
    max-height: 450px;
    width: auto;
    height: auto;
    border-radius: 25px;
    box-shadow: 0 0 50px rgba(180, 106, 255, 0.5);
    border: 3px solid rgba(180, 106, 255, 0.7);
    z-index: 1;
    object-fit: contain;
  }

  /* Кнопка Крутить */
  .action-btn {
    background: #b46aff;
    color: #000;
    font-family: 'Oswald', sans-serif;
    font-size: 24px;
    font-weight: bold;
    text-transform: uppercase;
    padding: 18px 60px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(180, 106, 255, 0.4);
    transition: all 0.3s;
    z-index: 3;
  }
  .action-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 40px rgba(180, 106, 255, 0.8);
  }

  /* Подпись автора */
  .made-by {
    position: absolute;
    bottom: 20px;
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 2px;
    z-index: 3;
  }

  /* ---------------- ПЛЕЕР СПРАВА СВЕРХУ ---------------- */
  .audio-player {
    position: absolute;
    top: 30px;
    right: 30px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: rgba(10, 10, 10, 0.8);
    border: 1px solid rgba(180, 106, 255, 0.3);
    padding: 12px 15px;
    border-radius: 12px;
    z-index: 10;
    width: 280px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.5);
  }

  .player-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .play-btn {
    background: #b46aff;
    border: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .play-btn:hover { transform: scale(1.1); }
  .play-btn svg { width: 14px; height: 14px; fill: #000; }

  .seek-bar {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .time-info {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: #aaa;
    font-family: 'Inter', sans-serif;
  }

  .volume-control {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }
  .volume-control svg { width: 16px; height: 16px; fill: #b46aff; flex-shrink: 0; }

  /* Общие стили для ползунков */
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    background: transparent;
    cursor: pointer;
  }
  input[type=range]:focus { outline: none; }
  
  input[type=range]::-webkit-slider-runnable-track {
    width: 100%;
    height: 4px;
    background: #444;
    border-radius: 2px;
  }
  
  input[type=range]::-webkit-slider-thumb {
    height: 12px;
    width: 12px;
    border-radius: 50%;
    background: #b46aff;
    -webkit-appearance: none;
    margin-top: -4px;
    box-shadow: 0 0 8px rgba(180, 106, 255, 0.8);
  }
  /* ------------------------------------------------------ */

  /* Оверлей результата */
  .result-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
    padding: 40px;
  }
  .result-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  
  .result-image {
    max-width: 340px;
    max-height: 340px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    border: 2px solid rgba(255,255,255,0.1);
    display: none;
    object-fit: contain;
  }

  .result-title {
    font-family: 'Oswald', sans-serif;
    font-size: 80px;
    color: #b46aff;
    margin-bottom: 15px;
    text-transform: uppercase;
    text-align: center;
    line-height: 1;
  }
  .result-sub {
    font-size: 20px;
    color: #ccc;
    text-align: center;
    max-width: 800px;
    font-style: italic;
    line-height: 1.4;
  }
  .result-sub.no { color: #ff4444; }

  @media (max-width: 768px) {
    .main-frame { padding: 20px; min-height: auto; gap: 30px; margin-top: 60px; }
    .hero-title { font-size: 50px; white-space: normal; }
    .center-gif { width: 280px; height: 280px; }
    .made-by { bottom: 10px; }
    
    /* Адаптация плеера под мобилки */
    .audio-player { 
      position: relative; 
      top: 0; 
      right: 0; 
      width: 100%; 
      max-width: 350px; 
      margin-bottom: 10px; 
    }
    body { padding-top: 20px; align-items: flex-start; }
  }
</style>
</head>
<body>

<div class="main-frame">
  
  <!-- НОВЫЙ АУДИОПЛЕЕР СПРАВА СВЕРХУ -->
  <div class="audio-player">
    <div class="player-controls">
      <button id="playBtn" class="play-btn">
        <!-- Иконка Play (по умолчанию) -->
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="seek-bar">
        <input type="range" id="seekSlider" min="0" max="100" value="0" step="0.1">
        <div class="time-info">
          <span id="currentTime">0:00</span>
          <span id="totalTime">0:00</span>
        </div>
      </div>
    </div>
    <div class="volume-control">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.4">
    </div>
  </div>

  <div class="hero-title">РЕГАТЬ ИЛИ НЕТ?</div>

  <img src="https://media1.tenor.com/m/9MwgBZ30qnsAAAAd/crona-soul-eater.gif" class="center-gif" alt="Crona">

  <button id="rollBtn" class="action-btn">Крутить судьбу</button>

  <div class="made-by">made by qwe1re</div>

  <!-- АУДИО -->
  <audio id="bgMusic" loop>
    <!-- Убедись, что файл music.mp3 лежит в папке с сайтом -->
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <!-- ОВЕРЛЕЙ РЕЗУЛЬТАТА -->
  <div id="resultOverlay" class="result-overlay">
    <img id="resImg" class="result-image" src="" alt="Результат">
    <div id="resTitle" class="result-title"></div>
    <div id="resSub" class="result-sub"></div>
    <button id="closeBtn" class="action-btn" style="margin-top: 40px; background: transparent; border: 2px solid #b46aff; color: #b46aff; box-shadow: none; padding: 12px 40px; font-size: 18px;">Закрыть</button>
  </div>

</div>

<script>
(function() {
  var rollBtn = document.getElementById('rollBtn');
  var overlay = document.getElementById('resultOverlay');
  var closeBtn = document.getElementById('closeBtn');
  
  var resImg = document.getElementById('resImg');
  var resTitle = document.getElementById('resTitle');
  var resSub = document.getElementById('resSub');

  // --- ЭЛЕМЕНТЫ ПЛЕЕРА ---
  var bgMusic = document.getElementById('bgMusic');
  var playBtn = document.getElementById('playBtn');
  var playIcon = document.getElementById('playIcon');
  var seekSlider = document.getElementById('seekSlider');
  var currentTimeEl = document.getElementById('currentTime');
  var totalTimeEl = document.getElementById('totalTime');
  var volumeSlider = document.getElementById('volumeSlider');

  // КАРТИНКИ ДЛЯ РЕЗУЛЬТАТОВ
  var YES_IMAGE_URL = "https://i.pinimg.com/736x/b5/ef/ab/b5efab201bf5ecca2d52fb496c6b0a7d.jpg"; 
  var NO_IMAGE_URL  = "https://i.pinimg.com/736x/f3/d7/47/f3d747fe35ddb4d1353ece896f566d1f.jpg";  
  
  // СПИСОК ЦИТАТ (в результатах)
  var quotes = [
    "«Абсолютный!»", "«Запоминайте цитату…»", "«Муваюсь так жёстко!»",
    "«Вы зашли на стрим к абсолютному»", "«Ты что, глупый?!»",
    "«Куда ты смотришь, боже?!»", "«Да как он это делает?!»",
    "«Если тебе тяжело идти — значит, ты тащишь мешок картошки»",
    "«Неважно, кто перед тобой. Важно, сколько у тебя патронов»",
    "«Лучше быть абсолютным в чате, чем относительным по жизни»",
    "«Жду всех абсолютных в группе»", "«Да он с софтом играет!»",
    "«Вы вообще понимаете, кто перед вами находится?»", "«Я двигаюсь на уверенном»",
    "«Цитата Ская, запоминайте!»", "«Сука знает, что я в деле!»",
    "«Я включаю режим абсолютного»", "«Это был тактический мув, вы ничего не понимаете»",
    "«Чат, вы видите этот абсурд?»", "«Да как это не залетело, я же ровно в голову целился!»",
    "«Всё, я в тильте, не трогайте меня»", "«Мой микрофон не выдерживает этой гениальности»",
    "«Это не я слил, это пинг»", "«Вы думали я проиграл? Это был байт!»",
    "«Я читаю эту игру как открытую книгу»", "«Где мой хедшот, игра сломалась»",
    "«Это уровень абсолютного, вам не понять»", "«Я просто на голову выше всех в этом лобби»",
    "«Это чистый лак, ему просто повезло»", "«Я не проигрываю, я просто даю им шанс»",
    "«Мой прайм-тайм начался»", "«Это абсолютная доминация»",
    "«Вы недооцениваете мою силу»", "«Абсолютные всегда побеждают»"
  ];

  // --- ЛОГИКА ПЛЕЕРА ---
  
  // Форматирование времени (из секунд в 0:00)
  function formatTime(seconds) {
    if (isNaN(seconds)) return "0:00";
    var m = Math.floor(seconds / 60);
    var s = Math.floor(seconds % 60);
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  // Play / Pause
  playBtn.addEventListener('click', function() {
    if (bgMusic.paused) {
      bgMusic.play();
      playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; // Иконка Паузы
    } else {
      bgMusic.pause();
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; // Иконка Плея
    }
  });

  // Обновление ползунка перемотки и времени при воспроизведении
  bgMusic.addEventListener('timeupdate', function() {
    if (!isNaN(bgMusic.duration)) {
      var percent = (bgMusic.currentTime / bgMusic.duration) * 100;
      seekSlider.value = percent;
      currentTimeEl.textContent = formatTime(bgMusic.currentTime);
    }
  });

  // Установка общей длительности при загрузке
  bgMusic.addEventListener('loadedmetadata', function() {
    totalTimeEl.textContent = formatTime(bgMusic.duration);
  });

  // Перемотка трека
  seekSlider.addEventListener('input', function() {
    if (!isNaN(bgMusic.duration)) {
      var seekTo = (this.value / 100) * bgMusic.duration;
      bgMusic.currentTime = seekTo;
    }
  });

  // Громкость
  volumeSlider.addEventListener('input', function() {
    bgMusic.volume = this.value;
  });
  bgMusic.volume = volumeSlider.value; // Начальная громкость


  // --- ЛОГИКА КНОПКИ РЕЗУЛЬТАТА ---

  rollBtn.addEventListener('click', function() {
    rollBtn.disabled = true;
    rollBtn.textContent = "Решаем...";

    var ticks = 0;
    var maxTicks = 25;
    
    var spin = setInterval(function() {
      ticks++;
      if (ticks >= maxTicks) {
        clearInterval(spin);
        showFinalResult();
        rollBtn.disabled = false;
        rollBtn.textContent = "Крутить судьбу";
      }
    }, 80);
  });

  function showFinalResult() {
    // Шансы 50/50
    var isYes = Math.random() < 0.5;
    var imgUrl = isYes ? YES_IMAGE_URL : NO_IMAGE_URL;
    var randomQuote = quotes[Math.floor(Math.random() * quotes.length)];

    resImg.style.display = 'block';
    resImg.src = imgUrl;

    if (isYes) {
      resTitle.textContent = "РЕГАТЬ!";
      resTitle.style.color = "#b46aff";
      resSub.textContent = randomQuote + " — Skywhywalker";
      resSub.className = "result-sub";
    } else {
      resTitle.textContent = "НЕ РЕГАТЬ";
      resTitle.style.color = "#ff4444";
      resSub.textContent = randomQuote + " — Skywhywalker";
      resSub.className = "result-sub no";
    }

    overlay.classList.add('active');
  }

  closeBtn.addEventListener('click', function() {
    overlay.classList.remove('active');
  });
})();
</script>
</body>
</html>
