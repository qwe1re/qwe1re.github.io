<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>РЕГАТЬ ИЛИ НЕТ? | КС + FACEIT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: #000;
    background-image: repeating-linear-gradient(90deg, #111 0px, #111 2px, #0a0a0a 2px, #0a0a0a 4px);
    color: #fff;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  .main-frame {
    width: 100%;
    max-width: 1200px;
    background-color: #050505;
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    border-radius: 30px;
    border: 2px solid #888;
    box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 50px rgba(0,0,0,0.9);
    padding: 40px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 600px; /* Чтобы контент не прилипал, когда убрали планету */
  }

  /* Главный заголовок РЕГАТЬ ИЛИ НЕТ? */
  .hero-title {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(60px, 11vw, 150px);
    line-height: 0.8;
    color: #8cf63a;
    text-transform: uppercase;
    letter-spacing: -2px;
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    z-index: 1;
    pointer-events: none;
    text-shadow: 0 10px 30px rgba(0,0,0,0.8);
    text-align: center;
  }

  /* Центральный блок с цитатами */
  .content-area {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center; /* Выровняли по центру, так как планету убрали */
    margin-top: 180px; /* Отступ под огромный заголовок */
    margin-bottom: 60px;
    z-index: 2;
    flex-grow: 1;
  }

  /* Цитаты по бокам */
  .text-col {
    width: 30%;
    font-size: 12px;
    line-height: 1.6;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    position: relative;
    padding-left: 15px;
  }
  
  /* Зеленая полоска слева для стиля */
  .text-col::before {
    content: '';
    position: absolute;
    left: 0;
    top: 2px;
    bottom: 2px;
    width: 3px;
    background-color: #8cf63a;
  }

  .text-col.right { 
    text-align: right; 
    padding-left: 0;
    padding-right: 15px;
  }
  .text-col.right::before {
    left: auto;
    right: 0;
  }

  /* Нижний текст */
  .bottom-text {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-family: 'Oswald', sans-serif;
    font-size: clamp(40px, 8vw, 100px);
    font-weight: 700;
    line-height: 0.9;
    text-transform: uppercase;
    position: relative;
    z-index: 3;
    margin-bottom: 40px;
  }

  .text-left { color: #fff; display: flex; align-items: center; gap: 20px;}
  .text-left .plus { color: #8cf63a; font-size: 1.2em; }
  .text-right { color: #fff; text-align: right; }

  /* Кнопка (по центру внизу) */
  .action-btn-wrapper {
    display: flex;
    justify-content: center;
    width: 100%;
  }

  .action-btn {
    background: #8cf63a;
    color: #000;
    font-family: 'Oswald', sans-serif;
    font-size: 24px;
    font-weight: bold;
    text-transform: uppercase;
    padding: 18px 60px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(140, 246, 58, 0.4);
    transition: all 0.3s;
  }
  .action-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 40px rgba(140, 246, 58, 0.8);
  }

  /* Блок результата */
  .result-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .result-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  
  .result-image {
    max-width: 350px;
    max-height: 350px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    display: none;
  }
  
  .result-emoji {
    font-size: 120px;
    margin-bottom: 20px;
    display: none;
  }

  .result-title {
    font-family: 'Oswald', sans-serif;
    font-size: 70px;
    color: #8cf63a;
    margin-bottom: 15px;
    text-transform: uppercase;
    text-align: center;
    line-height: 1;
  }
  .result-sub {
    font-size: 18px;
    color: #ccc;
    text-align: center;
    max-width: 700px;
    font-style: italic;
  }
  .result-sub.no { color: #ff4444; }

</style>
</head>
<body>

<div class="main-frame">
  
  <!-- Заголовок -->
  <div class="hero-title">РЕГАТЬ ИЛИ НЕТ?</div>

  <!-- Центральный блок с цитатами -->
  <div class="content-area">
    
    <!-- Левая цитата SkyWhyWalker -->
    <div class="text-col">
      «Я не токсик, я просто<br>
      эмоционально<br>
      выражаю свое мнение<br>
      о команде»
    </div>

    <!-- Правая цитата SkyWhyWalker -->
    <div class="text-col right">
      «Главное в игре — это не<br>
      победа, а удовольствие.<br>
      Ну и чтобы тиммейты<br>
      не были раками»
    </div>
  </div>

  <!-- Нижний текст -->
  <div class="bottom-text">
    <div class="text-left">
      КС <span class="plus">+</span>
    </div>
    <div class="text-right">
      FACEIT
    </div>
  </div>

  <!-- Кнопка -->
  <div class="action-btn-wrapper">
    <button id="rollBtn" class="action-btn">Крутить судьбу</button>
  </div>

  <!-- Оверлей с результатом -->
  <div id="resultOverlay" class="result-overlay">
    <img id="resImg" class="result-image" src="" alt="">
    <div id="resEmoji" class="result-emoji"></div>
    
    <div id="resTitle" class="result-title"></div>
    <div id="resSub" class="result-sub"></div>
    
    <button id="closeBtn" class="action-btn" style="margin-top: 40px; background: transparent; border: 2px solid #8cf63a; color: #8cf63a; box-shadow: none; padding: 12px 40px; font-size: 18px;">Закрыть</button>
  </div>

</div>

<script>
(function() {
  var rollBtn = document.getElementById('rollBtn');
  var overlay = document.getElementById('resultOverlay');
  var closeBtn = document.getElementById('closeBtn');
  
  var resImg = document.getElementById('resImg');
  var resEmoji = document.getElementById('resEmoji');
  var resTitle = document.getElementById('resTitle');
  var resSub = document.getElementById('resSub');

  // ==========================================
  // ВСТАВЬ ССЫЛКИ НА СВОИ КАРТИНКИ ЗДЕСЬ:
  var YES_IMAGE_URL = ""; 
  var NO_IMAGE_URL  = ""; 
  // ==========================================

  rollBtn.addEventListener('click', function() {
    rollBtn.disabled = true;
    rollBtn.textContent = "Решаем...";

    var ticks = 0;
    var maxTicks = 15;
    
    var spin = setInterval(function() {
      ticks++;
      if (ticks >= maxTicks) {
        clearInterval(spin);
        showFinalResult();
        rollBtn.disabled = false;
        rollBtn.textContent = "Крутить судьбу";
      }
    }, 80);
  });

  function showFinalResult() {
    // 30% - Да, 70% - Нет
    var isYes = Math.random() < 0.3;
    var imgUrl = isYes ? YES_IMAGE_URL : NO_IMAGE_URL;

    resImg.style.display = 'none';
    resEmoji.style.display = 'none';

    if (imgUrl && imgUrl.trim() !== "") {
      resImg.src = imgUrl;
      resImg.style.display = 'block';
    } else {
      resEmoji.textContent = isYes ? "🏆" : "💀";
      resEmoji.style.display = 'block';
    }

    if (isYes) {
      resTitle.textContent = "РЕГАТЬ!";
      resTitle.style.color = "#8cf63a";
      resSub.textContent = "«Сегодня можно и пострелять, главное — не забудь про позитив!» — SkyWhyWalker";
      resSub.className = "result-sub";
    } else {
      resTitle.textContent = "НЕ РЕГАТЬ";
      resTitle.style.color = "#ff4444";
      resSub.textContent = "«Иногда лучше просто выйти из игры и сохранить свои нервы» — SkyWhyWalker";
      resSub.className = "result-sub no";
    }

    overlay.classList.add('active');
  }

  closeBtn.addEventListener('click', function() {
    overlay.classList.remove('active');
  });
})();
</script>
</body>
</html>
