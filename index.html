<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>РЕГАТЬ ИЛИ НЕТ?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: #000;
    background-image: repeating-linear-gradient(90deg, #111 0px, #111 2px, #0a0a0a 2px, #0a0a0a 4px);
    color: #fff;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  .main-frame {
    width: 100%;
    max-width: 1300px;
    background-color: #050505;
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    border-radius: 30px;
    border: 2px solid #888;
    box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 50px rgba(0,0,0,0.9);
    padding: 50px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 750px;
    gap: 40px;
  }

  .hero-title {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(60px, 11vw, 150px);
    line-height: 0.8;
    color: #b46aff;
    text-transform: uppercase;
    letter-spacing: -2px;
    white-space: nowrap;
    z-index: 2;
    text-shadow: 0 10px 30px rgba(0,0,0,0.8);
    text-align: center;
  }

  .center-gif {
    max-width: 450px;
    max-height: 450px;
    width: auto;
    height: auto;
    border-radius: 25px;
    box-shadow: 0 0 50px rgba(180, 106, 255, 0.5);
    border: 3px solid rgba(180, 106, 255, 0.7);
    z-index: 1;
    object-fit: contain;
  }

  .action-btn {
    background: #b46aff;
    color: #000;
    font-family: 'Oswald', sans-serif;
    font-size: 24px;
    font-weight: bold;
    text-transform: uppercase;
    padding: 18px 60px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(180, 106, 255, 0.4);
    transition: all 0.3s;
    z-index: 3;
  }
  .action-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 40px rgba(180, 106, 255, 0.8);
  }

  /* Ссылка на Steam */
  .steam-link {
    position: absolute;
    bottom: 20px;
    left: 20px;
    z-index: 10;
    opacity: 0.3;
    transition: opacity 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .steam-link:hover { opacity: 1; }
  .steam-link svg { width: 24px; height: 24px; fill: #fff; }

  /* Плеер */
  .audio-player {
    position: absolute;
    bottom: 20px;
    right: 30px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: rgba(10, 10, 10, 0.85);
    border: 1px solid rgba(180, 106, 255, 0.3);
    padding: 12px 15px;
    border-radius: 12px;
    z-index: 10;
    width: 280px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.5);
  }

  .player-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .play-btn {
    background: #b46aff;
    border: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .play-btn:hover { transform: scale(1.1); }
  .play-btn svg { width: 14px; height: 14px; fill: #000; }

  .seek-bar {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .time-info {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: #aaa;
    font-family: 'Inter', sans-serif;
  }

  .volume-control {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }
  .volume-control svg { width: 16px; height: 16px; fill: #b46aff; flex-shrink: 0; }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    background: transparent;
    cursor: pointer;
  }
  input[type=range]:focus { outline: none; }
  
  input[type=range]::-webkit-slider-runnable-track {
    width: 100%;
    height: 4px;
    background: #444;
    border-radius: 2px;
  }
  
  input[type=range]::-webkit-slider-thumb {
    height: 12px;
    width: 12px;
    border-radius: 50%;
    background: #b46aff;
    -webkit-appearance: none;
    margin-top: -4px;
    box-shadow: 0 0 8px rgba(180, 106, 255, 0.8);
  }

  /* ================= АНИМАЦИЯ РУЛЕТКИ ================= */
  .roulette-container {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.95);
    display: none; 
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 15;
    backdrop-filter: blur(10px);
  }

  .roulette-container.active {
    display: flex;
  }

  .roulette-window {
    width: 700px; /* Сделали окно чуть шире, чтобы картинки лучше смотрелись */
    max-width: 95%;
    height: 200px; /* Увеличили высоту под картинки */
    background: #111;
    border: 3px solid #b46aff;
    border-radius: 15px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(180, 106, 255, 0.3);
  }

  .roulette-pointer {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 4px;
    background: #fff;
    transform: translateX(-50%);
    z-index: 2;
    box-shadow: 0 0 15px #fff, 0 0 30px #b46aff;
  }

  .roulette-track {
    display: flex;
    align-items: center;
    height: 100%;
    position: absolute;
    left: 0;
    will-change: transform;
  }

  /* Элемент рулетки (картинка + текст) */
  .roulette-item {
    width: 220px; /* Ширина одного элемента */
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-right: 2px solid #222;
    border-left: 2px solid #222;
    height: 100%;
    box-sizing: border-box;
    gap: 10px;
    background: rgba(255, 255, 255, 0.02);
  }

  .roulette-item img {
    width: 100px;
    height: 100px;
    border-radius: 10px;
    object-fit: cover;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
  }

  .roulette-item .item-text {
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
    font-weight: bold;
    text-transform: uppercase;
  }

  .roulette-item.yes .item-text { color: #b46aff; }
  .roulette-item.no .item-text { color: #ff4444; }
  /* ==================================================== */

  /* Оверлей результата */
  .result-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
    padding: 40px;
  }
  .result-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  
  .result-image {
    max-width: 300px;
    max-height: 300px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    border: 2px solid rgba(255,255,255,0.1);
    display: none;
    object-fit: contain;
  }

  .result-title {
    font-family: 'Oswald', sans-serif;
    font-size: 70px;
    color: #b46aff;
    margin-bottom: 15px;
    text-transform: uppercase;
    text-align: center;
    line-height: 1;
  }
  .result-sub {
    font-size: 18px;
    color: #ccc;
    text-align: center;
    max-width: 800px;
    font-style: italic;
    line-height: 1.4;
    margin-bottom: 20px;
  }
  .result-sub.no { color: #ff4444; }

  .result-buttons {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    margin-top: 10px;
  }

  .faceit-btn {
    background: #ff8c00;
    color: #000;
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    font-weight: bold;
    text-transform: uppercase;
    padding: 14px 40px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 0 20px rgba(255, 140, 0, 0.4);
    transition: all 0.3s;
    display: none; 
  }
  .faceit-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(255, 140, 0, 0.8);
    background: #ffaa33;
  }

  .youtube-btn {
    background: #ff0000;
    color: #fff;
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    font-weight: bold;
    text-transform: uppercase;
    padding: 14px 40px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
    transition: all 0.3s;
    display: none;
  }
  .youtube-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
    background: #ff3333;
  }

  .close-btn {
    background: transparent; 
    border: 2px solid #b46aff; 
    color: #b46aff; 
    box-shadow: none; 
    padding: 12px 40px; 
    font-size: 18px;
  }
  .close-btn:hover {
    background: rgba(180, 106, 255, 0.1);
  }

  @media (max-width: 768px) {
    .main-frame { padding: 20px; min-height: auto; gap: 30px; margin-top: 60px; padding-bottom: 120px; }
    .hero-title { font-size: 50px; white-space: normal; }
    .center-gif { width: 280px; height: 280px; }
    
    .roulette-window { height: 150px; }
    .roulette-item { width: 130px; gap: 5px; }
    .roulette-item img { width: 70px; height: 70px; }
    .roulette-item .item-text { font-size: 14px; }

    .audio-player { 
      position: relative; 
      bottom: 0; 
      right: 0; 
      width: 100%; 
      max-width: 350px; 
      margin: 0 auto;
    }
    .steam-link { bottom: 10px; left: 50%; transform: translateX(-50%); }
    body { padding-top: 20px; align-items: flex-start; }
    .result-image { max-width: 200px; max-height: 200px; }
    .result-title { font-size: 50px; }
    .result-sub { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="main-frame">
  
  <!-- Кнопка Steam -->
  <a href="https://steamcommunity.com/id/qweire/" target="_blank" class="steam-link" title="Мой Steam">
    <svg viewBox="0 0 24 24">
      <path d="M12 2a10 10 0 0 0-9.94 9.06L6.06 13a2.5 2.5 0 0 1 1.44-1.44A2.5 2.5 0 0 1 11 13.5a2.5 2.5 0 0 1-2.5 2.5 2.5 2.5 0 0 1-2.5-2.5v-.2L2.3 11.04A10 10 0 1 0 12 2zm0 15a7 7 0 1 1 0-14 7 7 0 0 1 0 14zm-3.5-5A2.5 2.5 0 1 0 11 14.5 2.5 2.5 0 0 0 8.5 12zm7.5-5A3.5 3.5 0 1 0 16 10.5 3.5 3.5 0 0 0 16 7zm-7 1a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/>
    </svg>
  </a>

  <div class="hero-title">РЕГАТЬ ИЛИ НЕТ?</div>

  <img src="https://media1.tenor.com/m/9MwgBZ30qnsAAAAd/crona-soul-eater.gif" class="center-gif" alt="Crona">

  <button id="rollBtn" class="action-btn">Крутить судьбу</button>

  <!-- Плеер -->
  <div class="audio-player">
    <div class="player-controls">
      <button id="playBtn" class="play-btn">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="seek-bar">
        <input type="range" id="seekSlider" min="0" max="100" value="0" step="0.1">
        <div class="time-info">
          <span id="currentTime">0:00</span>
          <span id="totalTime">0:00</span>
        </div>
      </div>
    </div>
    <div class="volume-control">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.4">
    </div>
  </div>

  <audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <!-- Рулетка -->
  <div id="rouletteContainer" class="roulette-container">
    <div class="roulette-window">
      <div class="roulette-pointer"></div>
      <div id="rouletteTrack" class="roulette-track"></div>
    </div>
  </div>

  <!-- Оверлей результата -->
  <div id="resultOverlay" class="result-overlay">
    <img id="resImg" class="result-image" src="" alt="Результат">
    <div id="resTitle" class="result-title"></div>
    <div id="resSub" class="result-sub"></div>
    
    <div class="result-buttons">
      <a href="https://www.faceit.com/ru/matchmaking" target="_blank" id="faceitBtn" class="faceit-btn">Играть на FACEIT</a>
      <a href="https://www.youtube.com/" target="_blank" id="youtubeBtn" class="youtube-btn">Смотреть YouTube</a>
      <button id="closeBtn" class="action-btn close-btn">Закрыть</button>
    </div>
  </div>

</div>

<script>
(function() {
  var rollBtn = document.getElementById('rollBtn');
  var overlay = document.getElementById('resultOverlay');
  var closeBtn = document.getElementById('closeBtn');
  
  var resImg = document.getElementById('resImg');
  var resTitle = document.getElementById('resTitle');
  var resSub = document.getElementById('resSub');
  var faceitBtn = document.getElementById('faceitBtn');
  var youtubeBtn = document.getElementById('youtubeBtn');

  var rouletteContainer = document.getElementById('rouletteContainer');
  var rouletteTrack = document.getElementById('rouletteTrack');

  var bgMusic = document.getElementById('bgMusic');
  var playBtn = document.getElementById('playBtn');
  var playIcon = document.getElementById('playIcon');
  var seekSlider = document.getElementById('seekSlider');
  var currentTimeEl = document.getElementById('currentTime');
  var totalTimeEl = document.getElementById('totalTime');
  var volumeSlider = document.getElementById('volumeSlider');

  var YES_IMAGE_URL = "https://i.pinimg.com/736x/b5/ef/ab/b5efab201bf5ecca2d52fb496c6b0a7d.jpg"; 
  var NO_IMAGE_URL  = "https://i.pinimg.com/736x/f3/d7/47/f3d747fe35ddb4d1353ece896f566d1f.jpg";  
  
  var quotes = [
    "«Абсолютный!»", "«Запоминайте цитату…»", "«Муваюсь так жёстко!»",
    "«Вы зашли на стрим к абсолютному»", "«Ты что, глупый?!»",
    "«Куда ты смотришь, боже?!»", "«Да как он это делает?!»",
    "«Если тебе тяжело идти — значит, ты тащишь мешок картошки»",
    "«Неважно, кто перед тобой. Важно, сколько у тебя патронов»",
    "«Лучше быть абсолютным в чате, чем относительным по жизни»",
    "«Жду всех абсолютных в группе»", "«Да он с софтом играет!»",
    "«Вы вообще понимаете, кто перед вами находится?»", "«Я двигаюсь на уверенном»",
    "«Цитата Ская, запоминайте!»", "«Сука знает, что я в деле!»",
    "«Я включаю режим абсолютного»", "«Это был тактический мув, вы ничего не понимаете»",
    "«Чат, вы видите этот абсурд?»", "«Да как это не залетело, я же ровно в голову целился!»",
    "«Всё, я в тильте, не трогайте меня»", "«Мой микрофон не выдерживает этой гениальности»",
    "«Это не я слил, это пинг»", "«Вы думали я проиграл? Это был байт!»",
    "«Я читаю эту игру как открытую книгу»", "«Где мой хедшот, игра сломалась»",
    "«Это уровень абсолютного, вам не понять»", "«Я просто на голову выше всех в этом лобби»",
    "«Это чистый лак, ему просто повезло»", "«Я не проигрываю, я просто даю им шанс»",
    "«Мой прайм-тайм начался»", "«Это абсолютная доминация»",
    "«Вы недооцениваете мою силу»", "«Абсолютные всегда побеждают»"
  ];

  // --- ПЛЕЕР ---
  function formatTime(seconds) {
    if (isNaN(seconds)) return "0:00";
    var m = Math.floor(seconds / 60);
    var s = Math.floor(seconds % 60);
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  playBtn.addEventListener('click', function() {
    if (bgMusic.paused) {
      bgMusic.play();
      playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    } else {
      bgMusic.pause();
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    }
  });

  bgMusic.addEventListener('timeupdate', function() {
    if (!isNaN(bgMusic.duration)) {
      var percent = (bgMusic.currentTime / bgMusic.duration) * 100;
      seekSlider.value = percent;
      currentTimeEl.textContent = formatTime(bgMusic.currentTime);
    }
  });

  bgMusic.addEventListener('loadedmetadata', function() {
    totalTimeEl.textContent = formatTime(bgMusic.duration);
  });

  seekSlider.addEventListener('input', function() {
    if (!isNaN(bgMusic.duration)) {
      var seekTo = (this.value / 100) * bgMusic.duration;
      bgMusic.currentTime = seekTo;
    }
  });

  volumeSlider.addEventListener('input', function() {
    bgMusic.volume = this.value;
  });
  bgMusic.volume = volumeSlider.value;

  // --- АВТОЗАПУСК МУЗЫКИ ---
  bgMusic.volume = 0.4;
  var playPromise = bgMusic.play();
  
  if (playPromise !== undefined) {
    playPromise.then(function() {
      playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    }).catch(function() {
      var enableAudio = function() {
        bgMusic.play();
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        document.removeEventListener('click', enableAudio);
        document.removeEventListener('touchstart', enableAudio);
      };
      document.addEventListener('click', enableAudio);
      document.addEventListener('touchstart', enableAudio);
    });
  }

  // --- РУЛЕТКА С КАРТИНКАМИ ---
  rollBtn.addEventListener('click', function() {
    rollBtn.disabled = true;
    rollBtn.style.opacity = '0.5';
    var isYes = Math.random() < 0.5;
    startRouletteAnimation(isYes);
  });

  function startRouletteAnimation(isYes) {
    rouletteTrack.innerHTML = '';
    rouletteTrack.style.transition = 'none';
    rouletteTrack.style.transform = 'translateX(0)';

    var itemsCount = 50;
    var winningIndex = 45;

    for (var i = 0; i < itemsCount; i++) {
      var el = document.createElement('div');
      el.className = 'roulette-item';
      
      // Определяем картинку и текст для текущего элемента
      var isWinning = (i === winningIndex);
      var currentIsYes;
      
      if (isWinning) {
        currentIsYes = isYes;
      } else {
        currentIsYes = Math.random() < 0.5;
      }

      el.classList.add(currentIsYes ? 'yes' : 'no');
      
      // Картинка
      var img = document.createElement('img');
      img.src = currentIsYes ? YES_IMAGE_URL : NO_IMAGE_URL;
      el.appendChild(img);
      
      // Текст
      var text = document.createElement('div');
      text.className = 'item-text';
      text.textContent = currentIsYes ? 'РЕГАТЬ' : 'НЕ РЕГАТЬ';
      el.appendChild(text);

      rouletteTrack.appendChild(el);
    }

    rouletteContainer.classList.add('active');
    
    // Ширина элемента (220px на десктопе, 130px на мобилке)
    var itemWidth = window.innerWidth <= 768 ? 130 : 220;
    var randomOffset = (Math.random() - 0.5) * (itemWidth * 0.6);
    var windowWidth = document.querySelector('.roulette-window').offsetWidth;
    
    setTimeout(function() {
      var moveDistance = (winningIndex * itemWidth) - (windowWidth / 2) + (itemWidth / 2) + randomOffset;
      rouletteTrack.style.transition = 'transform 5s cubic-bezier(0.15, 0.85, 0.3, 1)';
      rouletteTrack.style.transform = 'translateX(-' + moveDistance + 'px)';
      
      setTimeout(function() {
        rouletteContainer.classList.remove('active');
        showFinalResult(isYes);
        rollBtn.disabled = false;
        rollBtn.style.opacity = '1';
      }, 5200);
    }, 50);
  }

  function showFinalResult(isYes) {
    var imgUrl = isYes ? YES_IMAGE_URL : NO_IMAGE_URL;
    var randomQuote = quotes[Math.floor(Math.random() * quotes.length)];

    resImg.style.display = 'block';
    resImg.src = imgUrl;

    if (isYes) {
      resTitle.textContent = "РЕГАТЬ!";
      resTitle.style.color = "#b46aff";
      resSub.textContent = randomQuote + " — Skywhywalker";
      resSub.className = "result-sub";
      faceitBtn.style.display = 'block'; 
      youtubeBtn.style.display = 'none'; 
    } else {
      resTitle.textContent = "НЕ РЕГАТЬ";
      resTitle.style.color = "#ff4444";
      resSub.textContent = randomQuote + " — Skywhywalker";
      resSub.className = "result-sub no";
      faceitBtn.style.display = 'none'; 
      youtubeBtn.style.display = 'block'; 
    }

    overlay.classList.add('active');
  }

  closeBtn.addEventListener('click', function() {
    overlay.classList.remove('active');
  });
})();
</script>
</body>
</html>
