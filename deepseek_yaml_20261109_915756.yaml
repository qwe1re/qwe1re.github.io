name: Update releases

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run update script
        run: |
          # Здесь ваш скрипт, который перезаписывает releases.json
          # Например, Node.js-скрипт, дергающий Spotify API
          echo "Скрипт обновления не реализован"
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add releases.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update releases"
          git push