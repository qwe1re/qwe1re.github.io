<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПП Рецепт из Интернета 🥗</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(135deg, #a8e6cf 0%, #dcedc1 40%, #ffd3b6 100%);
  }

  .app {
    width: 100%;
    max-width: 680px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 28px;
    padding: 36px 32px 40px;
    box-shadow: 0 20px 50px rgba(60, 90, 60, 0.18);
    text-align: center;
  }

  h1 { font-size: 1.9rem; color: #2f5d3f; margin-bottom: 8px; }
  .subtitle { color: #6b8a74; font-size: 0.95rem; margin-bottom: 28px; }

  #btn {
    font-family: inherit;
    font-size: 1.15rem;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #4caf6d, #2f8f4e);
    border: none;
    border-radius: 50px;
    padding: 16px 42px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s;
    box-shadow: 0 8px 20px rgba(47, 143, 78, 0.35);
  }

  #btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(47, 143, 78, 0.45); }
  #btn:active:not(:disabled) { transform: scale(0.97); }
  #btn:disabled { opacity: 0.6; cursor: wait; }

  .card {
    margin-top: 28px;
    text-align: left;
    background: #f7fbf7;
    border: 1px solid #dcecdc;
    border-radius: 20px;
    padding: 24px 26px;
    display: none;
    animation: fadeIn 0.35s ease;
  }

  .card.show { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card h2 { color: #2f5d3f; font-size: 1.3rem; margin-bottom: 14px; line-height: 1.3; }

  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }

  .badge {
    background: #e3f3e6;
    color: #2f7d4a;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 20px;
  }

  .card h3 {
    color: #4a6b55;
    font-size: 0.95rem;
    margin: 16px 0 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .card ul, .card ol {
    padding-left: 20px;
    color: #3d5247;
    line-height: 1.7;
    font-size: 0.95rem;
  }

  .card ol li { margin-bottom: 6px; }

  .source-link {
    display: inline-block;
    margin-top: 16px;
    font-size: 0.85rem;
    color: #2f8f4e;
    text-decoration: none;
    border-bottom: 1px dashed #2f8f4e;
  }
  .source-link:hover { opacity: 0.8; }

  .error-msg {
    margin-top: 20px;
    padding: 12px 16px;
    background: #ffeaea;
    color: #c0392b;
    border-radius: 12px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<div class="app">
  <h1>ПП Рецепт из Интернета 🥗</h1>
  <p class="subtitle">Нажми кнопку — найдём случайный высокобелковый рецепт</p>

  <button id="btn">🎲 Найти рецепт</button>

  <div class="card" id="card">
    <h2 id="title"></h2>
    <div class="badges" id="badges"></div>
    <h3>Ингредиенты</h3>
    <ul id="ingredients"></ul>
    <h3>Приготовление</h3>
    <ol id="steps"></ol>
    <a class="source-link" id="source" href="#" target="_blank" rel="noopener">Открыть оригинал рецепта →</a>
  </div>

  <div class="error-msg" id="error" style="display:none;"></div>
</div>

<script>
// ============================================================
// 🔑 ВСТАВЬТЕ СЮДА ВАШ БЕСПЛАТНЫЙ API-КЛЮЧ SPOONACULAR
// ============================================================
const API_KEY = "ВАШ_API_КЛЮЧ_ЗДЕСЬ";

const btn = document.getElementById('btn');
const card = document.getElementById('card');
const titleEl = document.getElementById('title');
const badgesEl = document.getElementById('badges');
const ingredientsEl = document.getElementById('ingredients');
const stepsEl = document.getElementById('steps');
const sourceEl = document.getElementById('source');
const errorEl = document.getElementById('error');

function stripHtml(html) {
  if (!html) return "";
  return html.replace(/<[^>]*>?/gm, '');
}

async function fetchRandomPPRecipe() {
  btn.disabled = true;
  btn.textContent = "🔍 Ищем рецепт...";
  errorEl.style.display = 'none';
  card.classList.remove('show');

  try {
    // 1. Собираем оригинальный URL запроса к Spoonacular
    const originalUrl = `https://api.spoonacular.com/recipes/complexSearch?apiKey=${API_KEY}&diet=high-protein&number=10&addRecipeInformation=true&fillIngredients=true&sort=random&maxReadyTime=40`;

    // 2. Оборачиваем его в CORS-прокси cors.lol
    const proxiedUrl = `https://api.cors.lol/?url=${encodeURIComponent(originalUrl)}`;

    const searchRes = await fetch(proxiedUrl);
    if (!searchRes.ok) throw new Error(`Ошибка API: ${searchRes.status}`);
    const searchData = await searchRes.json();

    if (!searchData.results || searchData.results.length === 0) {
      throw new Error("Рецепты не найдены. Попробуйте ещё раз.");
    }

    const recipe = searchData.results[Math.floor(Math.random() * searchData.results.length)];

    titleEl.textContent = recipe.title;

    badgesEl.innerHTML = '';
    const badges = [];
    if (recipe.readyInMinutes) badges.push(`⏱ ${recipe.readyInMinutes} мин`);
    if (recipe.nutrition && recipe.nutrition.nutrients) {
      const cal = recipe.nutrition.nutrients.find(n => n.name === 'Calories');
      const prot = recipe.nutrition.nutrients.find(n => n.name === 'Protein');
      if (cal) badges.push(`🔥 ${Math.round(cal.amount)} ккал`);
      if (prot) badges.push(`💪 ${Math.round(prot.amount)} г белка`);
    }
    badges.forEach(text => {
      const span = document.createElement('span');
      span.className = 'badge';
      span.textContent = text;
      badgesEl.appendChild(span);
    });

    ingredientsEl.innerHTML = '';
    if (recipe.extendedIngredients) {
      recipe.extendedIngredients.forEach(ing => {
        const li = document.createElement('li');
        li.textContent = ing.original || ing.name;
        ingredientsEl.appendChild(li);
      });
    } else {
      ingredientsEl.innerHTML = '<li>Ингредиенты не указаны</li>';
    }

    stepsEl.innerHTML = '';
    let steps = [];
    if (recipe.analyzedInstructions && recipe.analyzedInstructions.length > 0) {
      steps = recipe.analyzedInstructions[0].steps.map(s => s.step);
    } else if (recipe.instructions) {
      const clean = stripHtml(recipe.instructions);
      steps = clean.split(/\n|\. /).filter(s => s.trim().length > 5);
    }

    if (steps.length > 0) {
      steps.forEach(step => {
        const li = document.createElement('li');
        li.textContent = step;
        stepsEl.appendChild(li);
      });
    } else {
      stepsEl.innerHTML = '<li>Инструкции не найдены. Откройте оригинал рецепта.</li>';
    }

    if (recipe.sourceUrl) {
      sourceEl.href = recipe.sourceUrl;
      sourceEl.style.display = 'inline-block';
    } else {
      sourceEl.style.display = 'none';
    }

    void card.offsetWidth;
    card.classList.add('show');

  } catch (err) {
    console.error(err);
    errorEl.textContent = `Не удалось загрузить рецепт: ${err.message}`;
    errorEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = "🎲 Найти рецепт";
  }
}

btn.addEventListener('click', fetchRandomPPRecipe);
</script>

</body>
</html>
